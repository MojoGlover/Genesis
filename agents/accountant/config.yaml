# Accountant Agent Configuration
# System Economic Intelligence and Financial Record Module

identity:
  designation: "Accountant"
  alias: "Ledger"
  role: "System Economic Intelligence"
  pronouns: "they/them"
  version: "2.0"
  owner: "Computer Black"

models:
  reasoning: "accountant:latest"   # Ollama model (built from Modelfile)
  fast: "qwen2.5:3b"               # Lightweight for quick cost lookups
  fallback: "claude-haiku-4-5"     # Anthropic fallback

storage:
  ledger_path: "~/.accountant/ledger.jsonl"
  budgets_path: "~/.accountant/budgets.json"
  alerts_path: "~/.accountant/alerts.jsonl"
  reports_dir: "~/.accountant/reports/"
  free_tier_path: "~/.accountant/free_tier.json"

# Budget defaults — override in ~/.accountant/budgets.json
budgets:
  daily_limit_usd: 5.00
  weekly_limit_usd: 25.00
  monthly_limit_usd: 100.00
  alert_at_percent: 80          # Fire alert at 80% of limit
  hard_stop_at_percent: 100     # Hard stop at 100%

# Alert configuration
alerts:
  enabled: true
  channels:
    - log                        # Always log
    - plugops                    # Push to PlugOps message bus (when available)
  thresholds:
    cost_spike_multiplier: 2.5   # Alert if daily cost 2.5x the rolling average
    free_tier_warning_pct: 85    # Alert at 85% of free tier usage
    anomaly_sensitivity: high

# API cost rates (USD per unit) — update as providers change pricing
# These are reference defaults; actual costs tracked from real receipts when available
api_rates:
  anthropic:
    claude-haiku-4-5:
      input_per_1k: 0.00025
      output_per_1k: 0.00125
    claude-sonnet-4-5:
      input_per_1k: 0.003
      output_per_1k: 0.015
    claude-opus-4-5:
      input_per_1k: 0.015
      output_per_1k: 0.075
  openai:
    gpt-4o-mini:
      input_per_1k: 0.00015
      output_per_1k: 0.0006
    gpt-4o:
      input_per_1k: 0.0025
      output_per_1k: 0.010
  google:
    gemini-flash:
      input_per_1k: 0.000075
      output_per_1k: 0.0003
  ollama:
    any:
      cost_per_call: 0.0         # Local inference — $0

# GCP Cloud Run cost reference
gcp:
  cloud_run:
    cpu_per_vcpu_second: 0.000024
    memory_per_gb_second: 0.0000025
    requests_per_million: 0.40
    free_tier:
      requests_per_month: 2000000
      cpu_seconds_per_month: 180000
      memory_gb_seconds_per_month: 360000

# Expense categories for tax prep
tax_categories:
  - software
  - hardware
  - cloud_services
  - ai_services
  - hosting
  - domain_registration
  - subscriptions
  - education
  - research_tools
  - marketing
  - advertising
  - professional_services
  - contractors
  - data_providers
  - platform_fees
  - transaction_fees
  - payment_processing
  - automation_tools
  - security_tools
  - analytics_tools
  - storage_services
  - compute_services
  - training_services
  - content_production
  - development_tools
  - other_business

integrations:
  plugops_url: "${PLUGOPS_URL}"
  ollama_url: "${OLLAMA_API_URL:-http://localhost:11434}"
