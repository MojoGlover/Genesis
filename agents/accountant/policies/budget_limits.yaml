# Budget Limits — override defaults from config.yaml
# Copy this to ~/.accountant/budgets.json (JSON format) to activate custom limits

daily_limit_usd:    5.00       # Hard cap for daily spending
weekly_limit_usd:   25.00      # Weekly aggregate limit
monthly_limit_usd:  100.00     # Monthly aggregate limit
alert_at_percent:   80         # Warn at 80% of any limit
hard_stop_at_percent: 100      # Alert critical at 100%

# Per-agent limits (optional — adds per-agent budget tracking)
per_agent:
  engineer0:  20.00   # per month
  madjanet:   10.00
  cerberus:    5.00
  accountant:  1.00   # should be near zero (local inference)

# Per-service caps
per_service:
  anthropic_monthly:  50.00
  openai_monthly:     20.00
  gcp_monthly:        15.00

# Free tier warning thresholds (% of limit before alert fires)
free_tier_warning_pct: 85
