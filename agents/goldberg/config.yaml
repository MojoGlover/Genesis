identity:
  designation: Goldberg
  alias: goldberg
  job_title:    "Art Director"
  role: AI art assistant — takes creative briefs and produces art direction, prompts,
    and image output
  pronouns: he/him
  owner: Computer Black
data_dir: ~/.goldberg
models:
  reasoning: goldberg:latest
  fast: llama3.2:3b
  chat: goldberg:latest
  code: qwen2.5-coder:7b
  embedding: all-mpnet-base-v2
tools:
  ollama_api: http://127.0.0.1:11434
  civitai_api_key: "0f60586cfc705462d800b479b7c6ba4f"  # stored 2026-06-06
loop:
  check_interval_seconds: 30
  max_concurrent_tasks: 3
  task_timeout_seconds: 300
  max_retries: 3
  retry_backoff_base: 2
plugops:
  url: "wss://plugzero-fmhdkkt4oq-uc.a.run.app/ws/goldberg"
  plugops_url: "https://plugzero-fmhdkkt4oq-uc.a.run.app"
  heartbeat_seconds: 10
  reconnect_max_seconds: 30

modules:
  plugops_bridge:
    heartbeat_seconds: 10
    reconnect_max_seconds: 30
    capabilities:
    - art_direction
    - image_generation
    - comfyui
    - prompt_engineering
    - style_curation
    - creative_briefing
    - chat
  memory_sync:
    sync_interval_seconds: 300
    tasks_limit: 100
    enabled: true
logging:
  level: INFO
  log_file: ''
port: 5006

api:
  enabled: true
  port: 5006
