# config.yaml — BlackZero agent template
# stamp.py loads this as YAML and overwrites identity/port/model fields.
# Do NOT use {{SLOT}} syntax here — this file must be valid YAML.

identity:
  designation: "BlackZero"
  alias:        "blackzero"
  name:         "BlackZero"
  id:           "blackzero"
  role:         "Base agent template — replace via stamp.py"
  owner:        "Computer Black"
  capabilities: ["chat"]

# Where the agent stores its persistent data (stamp.py rewrites this)
data_dir: "~/.blackzero"

# HTTP port (stamp.py rewrites this)
port: 5001

# HTTP API port — read by main.py and registry.register (stamp.py rewrites this)
api:
  port: 5001

# Model configuration
# provider: ollama | anthropic | openai
#   ollama     — use local model_gateway / Ollama (default)
#   anthropic  — cloud primary (requires ANTHROPIC_API_KEY in .env)
#   openai     — cloud primary (requires OPENAI_API_KEY in .env)
model:
  provider:       "ollama"
  cloud_model:    ""                       # e.g. claude-haiku-4-5 or gpt-4o-mini
  primary:        "qwen2.5-coder:7b"       # gateway model_id (ollama path)
  fallback:       "qwen2.5-coder:7b"       # direct ollama fallback
  cloud_fallback: ""                       # last-resort Anthropic model
  # Ordered fallback chain — first host that responds wins.
  # Keep URLs from shared.env.
  ollama_hosts:
    - name: plugfoe
      url: "http://100.67.171.41:11434"
      model: "qwen2.5-coder:7b"
    - name: plugwan
      url: "http://100.113.209.66:11434"
      model: "qwen2.5-coder:7b"

# Per-task model routing.
# SHARED-MODEL POLICY (Darnie, 2026-07-08): all agents share the same two
# models — a fast speech model (llama3.2:3b) for conversation/delivery and a
# deep-thinking model (qwen2.5-coder:7b) for tool loops, reasoning, and code.
# Persona lives in the mission file + system prompt, NOT in custom model
# weights. Rationale: per-agent persona models (agent_id:latest) forced
# constant model swapping on one-box hosts (60-90s reload per role switch)
# and made multi-node routing require syncing N custom models everywhere.
# Two shared models fit resident in RAM together and exist on every node.
# Both must support native tool calling (rules out phi4).
# Override with stamp.py --model only when an agent truly needs custom weights.
models:
  chat:      "llama3.2:3b"                # general conversation (speech-class)
  reasoning: "qwen2.5-coder:7b"           # tool use, problem solving
  fast:      "llama3.2:3b"                # mid-loop tool calls (must output JSON)
  code:      "qwen2.5-coder:7b"           # code generation
  embedding: "all-mpnet-base-v2"
  # Speech brain — takes inference output and delivers it to the user cleanly.
  # If empty, respond node skips the speech pass and returns inference output as-is.
  speech:    "llama3.2:3b"               # fast delivery layer
  # Self-critique judge for the hardening eval loop (agent/modules/hardening_eval.py).
  # Deliberately the SAME model as `reasoning`, not a second model — plugfoe holds
  # exactly one Ollama model set resident at a time (7.6GB RAM, no swap).
  judge:     "qwen2.5-coder:7b"

# Evaluator-Optimizer hardening loop (BOTICO_CANON.md §3 — the third checker,
# alongside the Operator and doctor.py). Judges each response against 4 axes
# (instruction/identity/claim/action integrity) after it's already been sent —
# detection + escalation only, never blocks or retries the response itself.
hardening:
  enabled: true
  # Ground truth for the action_integrity axis — what this agent is allowed to
  # do without escalating to Darnie first. stamp.py / per-agent config should
  # override this to match the agent's actual autonomy.loops/capabilities.
  autonomy_level: "supervised"

# PlugOps bridge config
plugops:
  # Fixed 2026-07-09: was a dead Cloud Run URL (pre-D2; PlugOps moved to
  # plugfoe). Runtime already overrides this via PLUGOPS_URL env var on every
  # deployed agent's systemd unit, so this was a masked/latent bug, not an
  # active one — but relying on every future deploy remembering that env
  # override is fragile. Fixed at the source so new builds get it right by
  # default without needing the override at all.
  url:                   "http://100.67.171.41:9000"
  heartbeat_seconds:     10
  reconnect_max_seconds: 30
  # Rule (Darnie 2026-06-05): agents may NOT serve requests without PlugOps registration.
  # Only Engineer0 sets this false — it's the infra agent that recovers the grid when PlugOps is down.
  require_plugops: true
  # Grid registration: agent's own reachable host + port, sent to PlugOps at register time.
  # PlugOps derives api_url = "http://{host}:{port}" and stores it.
  # Other agents then call GET /api/v1/agents/{id}/url instead of hardcoding this URL.
  # stamp.py sets these automatically. Override here if the agent runs on a non-default host.
  host: ""   # e.g. "178.105.62.143" — leave blank to skip grid registration
  port: 0    # e.g. 5001 — leave 0 to skip grid registration

# Infrastructure module clients (ports 9100–9109)
# All silent-fail — agent works even if a module is down.
#
# DEFERRED 2026-07-11 (audit): the 9100s daemon stack was RETIRED in D1
# (2026-06-11), but these clients still default enabled:true and call those
# dead ports. Consequences today: policy.allow() is fail-open so every gate
# returns True (policy gating is a no-op), and ledger.record_llm() writes cost
# entries into the void (the Accountant spend-gate has no data path). Decide
# per client: promote to a PlugOps endpoint (as D1 intends for mind_state /
# spend) or remove. Until then, treat policy/ledger/obs as non-functional.
# See memory: project-blackzero-deferred-security.
modules:
  base_url: "http://127.0.0.1"

  communication:
    port:    9100
    enabled: true

  registry:
    port:    9101
    enabled: true

  mind_state:
    port:    9102
    enabled: true
    # PlugOps URL for cross-host snapshots (Agent Hospital / mobility)
    # e.g. "https://plugzero-xyz.a.run.app"  — leave empty to disable
    plugops_url: ""

  supervisor:
    port:    9103
    enabled: true

  policy_gate:
    port:    9104
    enabled: true

  tool_bus:
    port:    9105
    enabled: true

  ledger:
    port:    9106
    enabled: true

  scheduler:
    port:    9107
    enabled: false

  observability:
    port:    9108
    enabled: true

  model_gateway:
    port:    9109
    enabled: true

# Agent mobility — move to plugwan for heavy tasks, return when done
# Set enabled: true and plugops_url to activate the migration trigger loop.
mobility:
  enabled: false
  plugops_url: "https://plugzero-581737577470.us-central1.run.app"

logging:
  level: "INFO"
