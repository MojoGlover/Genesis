# config.yaml — BlackZero agent template
# All stamp slots are replaced by stamp.py before use.
# Stamp slots: {{AGENT_ID}}, {{AGENT_NAME}}, {{AGENT_ROLE}},
#              {{AGENT_PORT}}, {{AGENT_MODEL}}, {{PLUGOPS_URL}}

identity:
  id:           "{{AGENT_ID}}"
  name:         "{{AGENT_NAME}}"
  role:         "{{AGENT_ROLE}}"
  owner:        "Computer Black"
  capabilities: ["chat"]

# Where the agent stores its persistent data
data_dir: "~/.{{AGENT_ID}}"

# Primary model — routed through model_gateway
model:
  primary: "{{AGENT_MODEL}}"

# HTTP API
api:
  host: "0.0.0.0"
  port: {{AGENT_PORT}}

# PlugOps WebSocket bridge
plugops:
  url:                   "{{PLUGOPS_URL}}"
  heartbeat_seconds:     10
  reconnect_max_seconds: 30

# Infrastructure module clients (ports 9100–9109)
# All silent-fail — agent works even if a module is down.
# Set enabled: false to skip a module entirely.
modules:
  base_url: "http://127.0.0.1"

  communication:
    port:    9100
    enabled: true

  registry:
    port:    9101
    enabled: true

  mind_state:
    port:    9102
    enabled: true

  supervisor:
    port:    9103
    enabled: true   # passive — supervisor watches us, nothing to call

  policy_gate:
    port:    9104
    enabled: true

  tool_bus:
    port:    9105
    enabled: true

  ledger:
    port:    9106
    enabled: true

  scheduler:
    port:    9107
    enabled: false  # opt-in — enable if agent needs scheduled jobs

  observability:
    port:    9108
    enabled: true

  model_gateway:
    port:    9109
    enabled: true

logging:
  level: "INFO"
