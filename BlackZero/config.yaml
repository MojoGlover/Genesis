# config.yaml — BlackZero agent template
# stamp.py loads this as YAML and overwrites identity/port/model fields.
# Do NOT use {{SLOT}} syntax here — this file must be valid YAML.

identity:
  designation: "BlackZero"
  alias:        "blackzero"
  role:         "Base agent template — replace via stamp.py"
  owner:        "Computer Black"
  capabilities: ["chat"]

# Where the agent stores its persistent data (stamp.py rewrites this)
data_dir: "~/.blackzero"

# HTTP port (stamp.py rewrites this)
port: 5001

# Primary model — routed through model_gateway (stamp.py rewrites models.*)
models:
  chat:      "blackzero-hardened:latest"
  reasoning: "blackzero-hardened:latest"
  fast:      "blackzero-hardened:latest"
  code:      "qwen2.5-coder:3b"
  embedding: "all-mpnet-base-v2"

# PlugOps bridge config
plugops:
  url:                   "https://plugzero-fmhdkkt4oq-uc.a.run.app"
  heartbeat_seconds:     10
  reconnect_max_seconds: 30

# Infrastructure module clients (ports 9100–9109)
# All silent-fail — agent works even if a module is down.
modules:
  base_url: "http://127.0.0.1"

  communication:
    port:    9100
    enabled: true

  registry:
    port:    9101
    enabled: true

  mind_state:
    port:    9102
    enabled: true

  supervisor:
    port:    9103
    enabled: true

  policy_gate:
    port:    9104
    enabled: true

  tool_bus:
    port:    9105
    enabled: true

  ledger:
    port:    9106
    enabled: true

  scheduler:
    port:    9107
    enabled: false

  observability:
    port:    9108
    enabled: true

  model_gateway:
    port:    9109
    enabled: true

logging:
  level: "INFO"
