id: satellite.plugtoo
kind: satellite
name: PlugToo (Tablet)
status: active
lifecycle: active
description: Teclast Android tablet. MadJanet's primary device. Small models only. Opportunistic — not always-on.
tailscale_ref: env.PLUGTREE_TAILSCALE  # 100.103.47.83
capabilities:
  - inference: llama3.2:3b (small/fast, mobile inference)
  - app: MadJanet tablet app (React Native / Expo, Plug2)
