always_on: false
policy:
  allow_agent_migration: false   # too small for full agent runtime
  confirmation_required: false
health:
  check: "curl http://100.103.47.83:11434/api/tags"
  interval_seconds: 120
  note: "Tablet Ollama is tier-1 for MadJanet only (llama3.2:3b). All other agents skip this node."
