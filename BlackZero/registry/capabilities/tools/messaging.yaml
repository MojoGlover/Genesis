id: tool.local.messaging
kind: tool
name: Messaging
status: active
lifecycle: active
adapter: agent.tools.messaging
description: Send messages to other agents and query the PlugOps agent roster.
risk_level: medium
side_effects: remote
allowed_modes: [act, repair]
policy:
  confirmation_required: never
  blocked_in: [explore, audit]
  notes: list_agents is read-only; send_to_agent posts to the PlugOps SSE bus and triggers other agents.
